    <!-- Suppress Vite dev WebSocket/HMR disconnect logs in AI Studio preview iframe -->
    <script>
      (function() {
        var methods = ['log', 'info', 'warn', 'error', 'debug'];
        for (var i = 0; i < methods.length; i++) {
          (function(m) {
            var orig = console[m];
            if (!orig) return;
            console[m] = function() {
              for (var j = 0; j < arguments.length; j++) {
                var arg = arguments[j];
                if (typeof arg === 'string' && (arg.indexOf('[vite]') !== -1 || arg.indexOf('vite-hmr') !== -1 || arg.indexOf('vite-ping') !== -1)) {
                  return;
                }
                if (arg && typeof arg === 'object' && arg.message && typeof arg.message === 'string' && (arg.message.indexOf('[vite]') !== -1 || arg.message.indexOf('WebSocket') !== -1)) {
                  return;
                }
              }
              orig.apply(console, arguments);
            };
          })(methods[i]);
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && typeof e.reason === 'string' && e.reason.indexOf('[vite]') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
          if (e && e.reason && e.reason.message && typeof e.reason.message === 'string' && e.reason.message.indexOf('[vite]') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
