<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White circular background -->
  <circle cx="256" cy="256" r="248" fill="#ffffff" />

  <!-- Outer Double Blue Border -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#0014e6" stroke-width="16" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#0014e6" stroke-width="7" />

  <!-- Geometric Inverted Blue Triangle Shapes -->
  <g fill="none" stroke="#0014e6" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Top outer bar -->
    <line x1="120" y1="160" x2="415" y2="160" stroke-width="16" />
    <!-- Left outer diagonal -->
    <line x1="98" y1="190" x2="245" y2="425" stroke-width="16" />
    <!-- Right outer diagonal -->
    <line x1="414" y1="160" x2="267" y2="425" stroke-width="16" />

    <!-- Top inner parallel line -->
    <line x1="130" y1="208" x2="325" y2="208" stroke-width="14" />
    <!-- Left inner diagonal -->
    <line x1="128" y1="208" x2="245" y2="390" stroke-width="14" />
    <!-- Right inner diagonal -->
    <line x1="325" y1="208" x2="267" y2="390" stroke-width="14" />
  </g>

  <!-- Bottom apex solid triangle tip -->
  <polygon points="256,436 216,374 296,374" fill="#0014e6" />

  <!-- Pink Lotus Flower -->
  <!-- Flower group with pure white outline separation for petals -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    
    <!-- Lower Left Horizontal Flaring Petal -->
    <path d="M 245 350 C 205 348 165 345 140 348 C 160 365 210 368 250 360 Z" fill="#f53598" />

    <!-- Lower Right Horizontal Flaring Petal -->
    <path d="M 267 350 C 307 348 347 345 372 348 C 352 365 302 368 262 360 Z" fill="#f53598" />

    <!-- Lower Center Calyx Base -->
    <path d="M 235 355 C 245 366 267 366 277 355 C 265 362 247 362 235 355 Z" fill="#eb2187" />

    <!-- Outer Left Bulbous Petal -->
    <path d="M 230 345 C 190 330 160 290 172 250 C 182 225 210 215 220 230 C 198 255 205 305 240 340 Z" fill="#f741a0" />

    <!-- Outer Right Bulbous Petal -->
    <path d="M 282 345 C 322 330 352 290 340 250 C 330 225 302 215 292 230 C 314 255 307 305 272 340 Z" fill="#f741a0" />

    <!-- Intermediate Left Petal -->
    <path d="M 248 340 C 220 310 205 260 220 220 C 228 200 240 195 244 205 C 230 235 235 295 252 335 Z" fill="#f952a9" />

    <!-- Intermediate Right Petal -->
    <path d="M 264 340 C 292 310 307 260 292 220 C 284 200 272 195 268 205 C 282 235 277 295 260 335 Z" fill="#f952a9" />

    <!-- Central Body Large Petal -->
    <path d="M 256 215 C 235 240 220 280 236 335 C 246 346 266 346 276 335 C 292 280 277 240 256 215 Z" fill="#fb60b2" />

    <!-- Center Top Pointed Bud Petal -->
    <path d="M 256 182 C 247 198 244 218 256 226 C 268 218 265 198 256 182 Z" fill="#f53598" />
  </g>
</svg>